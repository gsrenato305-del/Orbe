name: Build Orbe APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organizar arquivos
        run: |
          mkdir -p app/src/main/java/com/orbe/tv app/src/main/res/values
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv themes.xml app/src/main/res/values/
          mv MainActivity.kt app/src/main/java/com/orbe/tv/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceitar licencas do Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Orbe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
